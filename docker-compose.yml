version: '3.8'
services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
  
  api:
    image: python:3.9-alpine
    command: sh -c "while true; do sleep 2; wget -qO- http://frontend > /dev/null; done"
    depends_on:
      - frontend

  db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: netshield
